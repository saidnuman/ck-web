<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Giriş Yap - SKIMS Tasarım İncelemesi</title>
<link href="https://fonts.googleapis.com/css2?family=Oswald:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="Css/style.css">
<!-- FONT AWESOME -->
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
<script src="https://accounts.google.com/gsi/client" async defer></script>

<!-- GARANTİ ÇÖZÜM: Önbellek sorununu aşmak ve tasarımı kilitlemek için stilleri buraya ekliyoruz -->
<style>
    .login-page-body {
        display: flex;
        flex-direction: column;
        min-height: 100vh;
        background-color: #fcfbf9;
        margin: 0;
    }

    .login-container {
        flex-grow: 1;
        display: flex;
        align-items: center;     /* Dikeyde tam merkeze alır */
        justify-content: center; /* Yatayda tam merkeze alır */
        width: 100%;
        min-height: 60vh;
        padding: 40px 20px;
    }

    .login-content-box {
        width: 100%;
        max-width: 420px;
        text-align: center;
        background: #ffffff;
        border: 1px solid #e6e3de;
        padding: 36px 32px;
        box-sizing: border-box;
    }

    .login-title {
        font-size: 30px;
        font-weight: 700;
        color: #111;
        margin-bottom: 22px;
        text-align: center;
    }

    .auth-tabs {
        display: grid;
        grid-template-columns: 1fr 1fr;
        border-bottom: 1px solid #e5e5e5;
        margin-bottom: 22px;
    }

    .auth-tab-btn {
        background: none;
        border: none;
        padding: 12px 0;
        font-size: 13px;
        font-weight: 600;
        letter-spacing: 0.6px;
        text-transform: uppercase;
        color: #888;
        cursor: pointer;
        border-bottom: 2px solid transparent;
        transition: color 0.2s, border-color 0.2s;
    }

    .auth-tab-btn.active {
        color: #111;
        border-bottom-color: #111;
    }

    .auth-form {
        display: flex;
        flex-direction: column;
        gap: 14px;
        text-align: left;
    }

    .auth-field label {
        display: block;
        font-size: 12px;
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 0.4px;
        color: #333;
        margin-bottom: 6px;
    }

    .auth-field input {
        width: 100%;
        height: 46px;
        padding: 0 12px;
        border: 1px solid #c9c9c9;
        font-size: 14px;
        color: #111;
        background: #fff;
        box-sizing: border-box;
        outline: none;
        transition: border-color 0.2s;
    }

    .auth-field input:focus {
        border-color: #111;
    }

    .auth-submit-btn {
        width: 100%;
        height: 48px;
        margin-top: 6px;
        background-color: #111;
        color: #fff;
        border: 1px solid #111;
        font-size: 14px;
        font-weight: 600;
        letter-spacing: 0.8px;
        text-transform: uppercase;
        cursor: pointer;
        transition: background-color 0.2s;
    }

    .auth-submit-btn:hover {
        background-color: #333;
    }

    .auth-submit-btn:disabled {
        opacity: 0.6;
        cursor: not-allowed;
    }

    .auth-status-msg {
        display: none;
        padding: 10px 12px;
        font-size: 13px;
        margin-bottom: 14px;
        text-align: left;
    }

    .auth-status-msg.error {
        display: block;
        background: #fdecea;
        color: #8b1e16;
        border: 1px solid #f5c6cb;
    }

    .auth-status-msg.success {
        display: block;
        background: #edf7ed;
        color: #1e4620;
        border: 1px solid #c3e6cb;
    }

    .forgot-password-row {
        display: flex;
        justify-content: flex-end;
        margin-top: -6px;
        margin-bottom: -4px;
    }

    .forgot-password-link {
        background: none;
        border: none;
        padding: 0;
        font-size: 13px;
        font-weight: 500;
        color: #1d4ed8;
        text-decoration: underline;
        cursor: pointer;
    }

    .forgot-password-link:hover {
        color: #1e40af;
    }

    .auth-divider {
        display: flex;
        align-items: center;
        gap: 10px;
        margin: 8px 0 4px;
        color: #888;
        font-size: 12px;
        text-transform: uppercase;
        letter-spacing: 0.5px;
    }

    .auth-divider::before,
    .auth-divider::after {
        content: "";
        flex: 1;
        height: 1px;
        background: #e5e5e5;
    }

    .google-auth-slot {
        display: flex;
        justify-content: center;
        width: 100%;
        min-height: 44px;
    }

    .google-fallback-btn {
        width: 100%;
        height: 44px;
        display: inline-flex;
        align-items: center;
        justify-content: center;
        gap: 10px;
        background: #fff;
        color: #1f1f1f;
        border: 1px solid #dadce0;
        border-radius: 4px;
        font-size: 14px;
        font-weight: 500;
        cursor: pointer;
        transition: background-color 0.2s, border-color 0.2s;
    }

    .google-fallback-btn:hover {
        background: #f8f9fa;
        border-color: #c6c9cc;
    }

    .forgot-panel {
        display: none;
        flex-direction: column;
        gap: 14px;
        text-align: left;
    }

    .forgot-panel-desc {
        margin: 0;
        font-size: 13px;
        line-height: 1.5;
        color: #555;
    }

    .forgot-code-input {
        letter-spacing: 6px;
        font-size: 18px !important;
        font-weight: 700;
        text-align: center;
    }

    .forgot-secondary-actions {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin-top: 4px;
        gap: 10px;
    }

    .forgot-back-link {
        background: none;
        border: none;
        padding: 0;
        font-size: 13px;
        color: #555;
        text-decoration: underline;
        cursor: pointer;
    }

    .forgot-back-link:hover {
        color: #111;
    }

    @media (max-width: 768px) {
        .login-container {
            padding: 24px 14px 36px 14px;
            align-items: flex-start;
            min-height: auto;
        }

        .login-content-box {
            padding: 24px 18px;
            max-width: 100%;
        }

        .login-title {
            font-size: 24px;
            margin-bottom: 18px;
        }

        .auth-tab-btn {
            min-height: 44px;
            padding: 10px 4px;
        }

        .auth-field input {
            font-size: 16px;
            height: 46px;
        }

        .auth-submit-btn {
            height: 48px;
        }

        .forgot-password-link,
        .forgot-back-link {
            min-height: 40px;
            display: inline-flex;
            align-items: center;
        }

        .forgot-secondary-actions {
            flex-wrap: wrap;
        }

        .google-auth-slot {
            overflow: hidden;
        }
    }

    @media (max-width: 480px) {
        .login-container {
            padding: 18px 12px 28px 12px;
        }

        .login-content-box {
            padding: 22px 14px;
        }

        .login-title {
            font-size: 22px;
        }
    }
</style>
</head>
<body class="login-page-body">

<!-- HEADER (LOGO VE MENÜ BÖLÜMÜ) -->
<header class="header-top" id="header-logo-container"></header>
<nav class="header-bottom" id="header-nav-container"></nav>

<!-- GİRİŞ YAP / KAYIT OL (JWT AUTH) BÖLÜMÜ -->
<main class="login-container">
    <div class="login-content-box">
        <h1 class="login-title" id="auth-page-heading">Giriş Yap</h1>

        <div class="auth-tabs" id="auth-tabs-bar">
            <button type="button" class="auth-tab-btn active" id="tab-login-btn">Giriş Yap</button>
            <button type="button" class="auth-tab-btn" id="tab-register-btn">Kayıt Ol</button>
        </div>

        <div id="auth-status-msg" class="auth-status-msg"></div>

        <!-- E-posta & Şifre ile Giriş Formu -->
        <form id="jwt-login-form" class="auth-form">
            <div class="auth-field">
                <label for="login-email">E-posta Adresi</label>
                <input type="email" id="login-email" required placeholder="ornek@eposta.com" autocomplete="email">
            </div>
            <div class="auth-field">
                <label for="login-password">Şifre</label>
                <input type="password" id="login-password" required placeholder="Şifreniz" autocomplete="current-password">
            </div>
            <div class="forgot-password-row">
                <button type="button" id="forgot-password-trigger" class="forgot-password-link">Şifremi Unuttum</button>
            </div>
            <button type="submit" class="auth-submit-btn" id="login-submit-btn">E-posta ile Giriş Yap</button>
            <div class="auth-divider"><span>veya</span></div>
            <div id="google-login-btn-slot" class="google-auth-slot"></div>
        </form>

        <!-- Yeni Kullanıcı Kayıt Formu -->
        <form id="jwt-register-form" class="auth-form" style="display: none;">
            <div class="auth-field">
                <label for="register-fullname">Ad Soyad</label>
                <input type="text" id="register-fullname" required placeholder="Adınız Soyadınız" autocomplete="name">
            </div>
            <div class="auth-field">
                <label for="register-email">E-posta Adresi</label>
                <input type="email" id="register-email" required placeholder="ornek@eposta.com" autocomplete="email">
            </div>
            <div class="auth-field">
                <label for="register-password">Şifre (En az 6 karakter)</label>
                <input type="password" id="register-password" required minlength="6" placeholder="••••••••" autocomplete="new-password">
            </div>
            <button type="submit" class="auth-submit-btn" id="register-submit-btn">Hesap Oluştur</button>
            <div class="auth-divider"><span>veya</span></div>
            <div id="google-register-btn-slot" class="google-auth-slot"></div>
        </form>

        <!-- Şifremi Unuttum (6 Haneli E-posta Doğrulama Kodu) Paneli -->
        <div id="forgot-password-panel" class="forgot-panel">
            <form id="forgot-step1-form" class="auth-form">
                <p class="forgot-panel-desc">Kayıtlı e-posta adresinizi girin. Şifre sıfırlama için 6 haneli tek kullanımlık doğrulama kodu göndereceğiz.</p>
                <div class="auth-field">
                    <label for="forgot-email">E-posta Adresi</label>
                    <input type="email" id="forgot-email" required placeholder="ornek@eposta.com" autocomplete="email">
                </div>
                <button type="submit" class="auth-submit-btn" id="forgot-send-code-btn">Doğrulama Kodu Gönder</button>
                <div class="forgot-secondary-actions">
                    <button type="button" class="forgot-back-link" id="forgot-back-step1-btn">← Giriş Yap ekranına dön</button>
                </div>
            </form>

            <form id="forgot-step2-form" class="auth-form" style="display: none;">
                <p class="forgot-panel-desc"><strong id="forgot-target-email-label"></strong> adresine gönderilen 6 haneli doğrulama kodunu ve yeni şifrenizi girin.</p>
                <div class="auth-field">
                    <label for="forgot-code">6 Haneli Doğrulama Kodu</label>
                    <input type="text" id="forgot-code" class="forgot-code-input" required maxlength="6" minlength="6" inputmode="numeric" pattern="[0-9]{6}" placeholder="000000" autocomplete="one-time-code">
                </div>
                <div class="auth-field">
                    <label for="forgot-new-password">Yeni Şifre (En az 6 karakter)</label>
                    <input type="password" id="forgot-new-password" required minlength="6" placeholder="••••••••" autocomplete="new-password">
                </div>
                <div class="auth-field">
                    <label for="forgot-confirm-password">Yeni Şifre Tekrar</label>
                    <input type="password" id="forgot-confirm-password" required minlength="6" placeholder="••••••••" autocomplete="new-password">
                </div>
                <button type="submit" class="auth-submit-btn" id="forgot-reset-submit-btn">Şifreyi Güncelle</button>
                <div class="forgot-secondary-actions">
                    <button type="button" class="forgot-back-link" id="forgot-back-step2-btn">← Giriş Yap ekranına dön</button>
                    <button type="button" class="forgot-password-link" id="forgot-resend-code-btn">Kodu tekrar gönder</button>
                </div>
            </form>
        </div>
    </div>
</main>

<!-- FOOTER BÖLÜMÜ -->
<footer class="site-footer">
    <div class="footer-container">
        <div class="footer-left">
            <div class="logo-container" id="footer-logo-container"></div>
            <p class="footer-description" id="footer-text-container"></p>
        </div>
        <div class="footer-right">
            <ul class="social-links" id="social-links-container"></ul>
        </div>
    </div>
    <div class="footer-bottom">
        <p>&copy; <span id="current-year"></span> Tüm Hakları Saklıdır.</p>
    </div>
</footer>

<!-- SCRIPTLER -->
<script src="Js/api.js"></script>
<script src="Js/app.js"></script>
<script>
    document.addEventListener("DOMContentLoaded", () => {
        const authTabsBar = document.getElementById("auth-tabs-bar");
        const tabLoginBtn = document.getElementById("tab-login-btn");
        const tabRegisterBtn = document.getElementById("tab-register-btn");
        const loginForm = document.getElementById("jwt-login-form");
        const registerForm = document.getElementById("jwt-register-form");
        const forgotPanel = document.getElementById("forgot-password-panel");
        const forgotStep1Form = document.getElementById("forgot-step1-form");
        const forgotStep2Form = document.getElementById("forgot-step2-form");
        const forgotTriggerBtn = document.getElementById("forgot-password-trigger");
        const forgotBackStep1Btn = document.getElementById("forgot-back-step1-btn");
        const forgotBackStep2Btn = document.getElementById("forgot-back-step2-btn");
        const forgotResendBtn = document.getElementById("forgot-resend-code-btn");
        const forgotTargetEmailLabel = document.getElementById("forgot-target-email-label");
        const heading = document.getElementById("auth-page-heading");
        const statusMsg = document.getElementById("auth-status-msg");

        let activeForgotEmail = "";

        function showStatus(type, text) {
            statusMsg.className = `auth-status-msg ${type}`;
            statusMsg.textContent = text;
        }

        function clearStatus() {
            statusMsg.className = "auth-status-msg";
            statusMsg.textContent = "";
        }

        function showLoginTab(keepStatus = false) {
            authTabsBar.style.display = "grid";
            forgotPanel.style.display = "none";
            tabLoginBtn.classList.add("active");
            tabRegisterBtn.classList.remove("active");
            loginForm.style.display = "flex";
            registerForm.style.display = "none";
            heading.textContent = "Giriş Yap";
            if (!keepStatus) clearStatus();
        }

        function showRegisterTab() {
            authTabsBar.style.display = "grid";
            forgotPanel.style.display = "none";
            tabRegisterBtn.classList.add("active");
            tabLoginBtn.classList.remove("active");
            registerForm.style.display = "flex";
            loginForm.style.display = "none";
            heading.textContent = "Kayıt Ol";
            clearStatus();
        }

        function openForgotPasswordPanel() {
            authTabsBar.style.display = "none";
            loginForm.style.display = "none";
            registerForm.style.display = "none";
            forgotPanel.style.display = "flex";
            forgotStep1Form.style.display = "flex";
            forgotStep2Form.style.display = "none";
            heading.textContent = "Şifre Sıfırlama";
            clearStatus();

            const loginEmailVal = document.getElementById("login-email").value.trim();
            const forgotEmailInput = document.getElementById("forgot-email");
            if (loginEmailVal && !forgotEmailInput.value.trim()) {
                forgotEmailInput.value = loginEmailVal;
            }
            forgotEmailInput.focus();
        }

        tabLoginBtn.addEventListener("click", () => showLoginTab(false));
        tabRegisterBtn.addEventListener("click", () => showRegisterTab());
        forgotTriggerBtn.addEventListener("click", openForgotPasswordPanel);
        forgotBackStep1Btn.addEventListener("click", () => showLoginTab(false));
        forgotBackStep2Btn.addEventListener("click", () => showLoginTab(false));

        async function completeAuthSuccess(response) {
            showStatus("success", `Hoş geldiniz, ${response.user.fullName}! Yönlendiriliyorsunuz...`);
            if (typeof guncelleProfilMenusu === "function") guncelleProfilMenusu();
            setTimeout(() => {
                if (typeof oncekiSayfayaGeriDon === "function") {
                    oncekiSayfayaGeriDon();
                } else {
                    window.location.href = "index.html";
                }
            }, 400);
        }

        loginForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            clearStatus();

            const executeLogin = async () => {
                const submitBtn = document.getElementById("login-submit-btn");
                const email = document.getElementById("login-email").value.trim();
                const password = document.getElementById("login-password").value;
                submitBtn.disabled = true;
                submitBtn.textContent = "Giriş yapılıyor...";

                try {
                    const res = await SkimsApi.login({ email, password });
                    await completeAuthSuccess(res);
                } catch (err) {
                    showStatus("error", err.message || "Giriş başarısız. E-posta ve şifrenizi kontrol edin.");
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.textContent = "E-posta ile Giriş Yap";
                }
            };

            if (typeof hasKvkkConsent === "function" && !hasKvkkConsent() && typeof zorunluKvkkModalGoster === "function") {
                zorunluKvkkModalGoster(executeLogin);
                return;
            }
            await executeLogin();
        });

        registerForm.addEventListener("submit", async (e) => {
            e.preventDefault();
            clearStatus();

            const executeRegister = async () => {
                const submitBtn = document.getElementById("register-submit-btn");
                const fullName = document.getElementById("register-fullname").value.trim();
                const email = document.getElementById("register-email").value.trim();
                const password = document.getElementById("register-password").value;
                submitBtn.disabled = true;
                submitBtn.textContent = "Hesap oluşturuluyor...";

                try {
                    const res = await SkimsApi.register({ fullName, email, password });
                    await completeAuthSuccess(res);
                } catch (err) {
                    showStatus("error", err.message || "Kayıt işlemi başarısız oldu.");
                } finally {
                    submitBtn.disabled = false;
                    submitBtn.textContent = "Hesap Oluştur";
                }
            };

            if (typeof hasKvkkConsent === "function" && !hasKvkkConsent() && typeof zorunluKvkkModalGoster === "function") {
                zorunluKvkkModalGoster(executeRegister);
                return;
            }
            await executeRegister();
        });

        // Şifremi Unuttum — Adım 1: 6 Haneli Kod Gönderme
        forgotStep1Form.addEventListener("submit", async (e) => {
            e.preventDefault();
            clearStatus();

            const email = document.getElementById("forgot-email").value.trim();
            const sendBtn = document.getElementById("forgot-send-code-btn");
            sendBtn.disabled = true;
            sendBtn.textContent = "Kod gönderiliyor...";

            try {
                const res = await SkimsApi.forgotPassword(email);
                activeForgotEmail = email;
                forgotTargetEmailLabel.textContent = email;
                document.getElementById("forgot-code").value = "";
                document.getElementById("forgot-new-password").value = "";
                document.getElementById("forgot-confirm-password").value = "";
                forgotStep1Form.style.display = "none";
                forgotStep2Form.style.display = "flex";
                showStatus("success", (res && res.message) || "6 haneli doğrulama kodu e-posta adresinize gönderildi.");
                document.getElementById("forgot-code").focus();
            } catch (err) {
                showStatus("error", err.message || "Doğrulama kodu gönderilemedi.");
            } finally {
                sendBtn.disabled = false;
                sendBtn.textContent = "Doğrulama Kodu Gönder";
            }
        });

        // Şifremi Unuttum — Kodu Tekrar Gönder
        forgotResendBtn.addEventListener("click", async () => {
            if (!activeForgotEmail) return;
            clearStatus();
            forgotResendBtn.disabled = true;
            forgotResendBtn.textContent = "Gönderiliyor...";

            try {
                const res = await SkimsApi.forgotPassword(activeForgotEmail);
                showStatus("success", (res && res.message) || "Yeni 6 haneli doğrulama kodu gönderildi.");
            } catch (err) {
                showStatus("error", err.message || "Yeni doğrulama kodu gönderilemedi.");
            } finally {
                forgotResendBtn.disabled = false;
                forgotResendBtn.textContent = "Kodu tekrar gönder";
            }
        });

        // 6 haneli kod alanına yapıştırılan boşluk veya tireleri otomatik temizle
        const forgotCodeInput = document.getElementById("forgot-code");
        if (forgotCodeInput) {
            forgotCodeInput.addEventListener("input", () => {
                const digitsOnly = forgotCodeInput.value.replace(/\D/g, "").slice(0, 6);
                if (forgotCodeInput.value !== digitsOnly) {
                    forgotCodeInput.value = digitsOnly;
                }
            });
        }

        // Şifremi Unuttum — Adım 2 & 3: Kodu Doğrula ve Yeni Şifreyi Kaydet
        forgotStep2Form.addEventListener("submit", async (e) => {
            e.preventDefault();
            clearStatus();

            const code = document.getElementById("forgot-code").value.replace(/\D/g, "").trim();
            const newPassword = document.getElementById("forgot-new-password").value;
            const confirmNewPassword = document.getElementById("forgot-confirm-password").value;

            if (code.length !== 6) {
                showStatus("error", "Lütfen e-postanıza gelen 6 haneli sayısal doğrulama kodunu eksiksiz girin.");
                return;
            }

            if (newPassword.length < 6) {
                showStatus("error", "Yeni şifre en az 6 karakter olmalıdır.");
                return;
            }

            if (newPassword !== confirmNewPassword) {
                showStatus("error", "Girilen şifreler birbiriyle uyuşmuyor.");
                return;
            }

            const submitBtn = document.getElementById("forgot-reset-submit-btn");
            submitBtn.disabled = true;
            submitBtn.textContent = "Güncelleniyor...";

            try {
                const res = await SkimsApi.resetPassword({
                    email: activeForgotEmail,
                    code,
                    newPassword,
                    confirmNewPassword
                });
                document.getElementById("login-email").value = activeForgotEmail;
                document.getElementById("login-password").value = "";
                showLoginTab(true);
                showStatus("success", (res && res.message) || "Şifreniz başarıyla güncellendi. Yeni şifrenizle giriş yapabilirsiniz.");
            } catch (err) {
                showStatus("error", err.message || "Şifre sıfırlama işlemi başarısız oldu.");
            } finally {
                submitBtn.disabled = false;
                submitBtn.textContent = "Şifreyi Güncelle";
            }
        });

        // Google Identity Services (GIS) — Gerçek Google OAuth 2.0 Giriş / Kayıt
        const googleIconSvg = `
            <svg width="18" height="18" viewBox="0 0 18 18" aria-hidden="true">
                <path fill="#4285F4" d="M17.64 9.2c0-.64-.06-1.25-.16-1.84H9v3.48h4.84a4.14 4.14 0 0 1-1.8 2.72v2.26h2.92c1.7-1.57 2.68-3.88 2.68-6.62z"/>
                <path fill="#34A853" d="M9 18c2.43 0 4.47-.8 5.96-2.18l-2.92-2.26c-.8.54-1.84.86-3.04.86-2.34 0-4.32-1.58-5.03-3.7H.96v2.33A9 9 0 0 0 9 18z"/>
                <path fill="#FBBC05" d="M3.97 10.72A5.4 5.4 0 0 1 3.69 9c0-.6.1-1.17.28-1.72V4.95H.96A9 9 0 0 0 0 9c0 1.45.35 2.82.96 4.05l3.01-2.33z"/>
                <path fill="#EA4335" d="M9 3.58c1.32 0 2.5.45 3.44 1.35l2.58-2.58C13.46.89 11.43 0 9 0A9 9 0 0 0 .96 4.95l3.01 2.33C4.68 5.16 6.66 3.58 9 3.58z"/>
            </svg>`;

        function renderGoogleFallbackButtons(errorMessage) {
            const loginSlot = document.getElementById("google-login-btn-slot");
            const registerSlot = document.getElementById("google-register-btn-slot");
            const slots = [
                { el: loginSlot, label: "Google ile Giriş Yap" },
                { el: registerSlot, label: "Google ile Kayıt Ol" }
            ];
            slots.forEach(({ el, label }) => {
                if (!el) return;
                el.innerHTML = `<button type="button" class="google-fallback-btn">${googleIconSvg}<span>${label}</span></button>`;
                el.querySelector("button").addEventListener("click", () => {
                    showStatus("error", errorMessage);
                });
            });
        }

        async function handleGoogleCredential(response) {
            if (!response || !response.credential) {
                showStatus("error", "Google doğrulama bilgisi alınamadı.");
                return;
            }
            clearStatus();

            const executeGoogleAuth = async () => {
                try {
                    const res = await SkimsApi.googleAuth(response.credential);
                    await completeAuthSuccess(res);
                } catch (err) {
                    showStatus("error", err.message || "Google ile giriş başarısız oldu.");
                }
            };

            if (typeof hasKvkkConsent === "function" && !hasKvkkConsent() && typeof zorunluKvkkModalGoster === "function") {
                zorunluKvkkModalGoster(executeGoogleAuth);
                return;
            }
            await executeGoogleAuth();
        }

        async function initGoogleSignIn() {
            const loginSlot = document.getElementById("google-login-btn-slot");
            const registerSlot = document.getElementById("google-register-btn-slot");
            if (!loginSlot || !registerSlot) return;

            let cfg = null;
            try {
                cfg = await SkimsApi.getGoogleClientId();
            } catch {
                renderGoogleFallbackButtons("Google giriş yapılandırması sunucudan alınamadı.");
                return;
            }

            if (!cfg || !cfg.enabled || !cfg.clientId) {
                renderGoogleFallbackButtons("Google ile giriş henüz yapılandırılmamış. Lütfen appsettings.Local.json dosyasına Google:ClientId bilgisini ekleyin.");
                return;
            }

            const waitForGoogleGsi = () => new Promise((resolve) => {
                if (window.google && window.google.accounts && window.google.accounts.id) {
                    resolve(true);
                    return;
                }
                let attempts = 0;
                const timer = setInterval(() => {
                    attempts += 1;
                    if (window.google && window.google.accounts && window.google.accounts.id) {
                        clearInterval(timer);
                        resolve(true);
                    } else if (attempts >= 40) {
                        clearInterval(timer);
                        resolve(false);
                    }
                }, 150);
            });

            const gsiLoaded = await waitForGoogleGsi();
            if (!gsiLoaded) {
                renderGoogleFallbackButtons("Google giriş servisi yüklenemedi. İnternet bağlantınızı kontrol edip sayfayı yenileyin.");
                return;
            }

            window.google.accounts.id.initialize({
                client_id: cfg.clientId,
                callback: handleGoogleCredential
            });

            const availableWidth = loginSlot.clientWidth || loginSlot.parentElement?.clientWidth || 320;
            const buttonWidth = Math.min(354, Math.max(200, availableWidth));
            window.google.accounts.id.renderButton(loginSlot, {
                theme: "outline",
                size: "large",
                type: "standard",
                shape: "rectangular",
                text: "signin_with",
                locale: "tr",
                width: buttonWidth
            });

            window.google.accounts.id.renderButton(registerSlot, {
                theme: "outline",
                size: "large",
                type: "standard",
                shape: "rectangular",
                text: "signup_with",
                locale: "tr",
                width: buttonWidth
            });
        }

        initGoogleSignIn();
    });
</script>
